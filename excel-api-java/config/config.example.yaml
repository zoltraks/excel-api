server:
  port: 8443
  host: "0.0.0.0"
  base_path: "/api/v1"
  tls:
    enabled: false
    # cert_file: "certs/server.crt"  # PEM certificate, required when enabled
    # key_file: "certs/server.key"   # PEM private key, required when enabled
  cors:
    enabled: true
    # Cross-origin allowlist; empty list denies all cross-origin requests.
    # "*" allows any origin but disables credentialed requests.
    allowed_origins: []

openapi:
  title: "Excel API"
  description: "Excel file data service"
  servers:
    - url: "http://localhost:8443/api/v1"
      description: "Local"

registry:
  directory: "/data/workbooks"
  workbooks:
    - id: "sample"
      path: "sample.xlsx"
      readonly: false

rate_limit:
  enabled: true
  token_per_minute: 20      # POST /auth/token attempts per source IP
  requests_per_minute: 600  # all other requests per source IP

queue:
  batch_max_size: 50
  batch_debounce_ms: 200
  lock_timeout_ms: 30000
  lock_dir: "/data/locks"

cache:
  enabled: true
  invalidation: "mtime"
  poll_interval_ms: 2000

auth:
  mode: "both"
  jwt:
    issuer: "excel-api"
    expiration_minutes: 60
    algorithm: "HS256"

logging:
  level: "info"
  format: "json"
